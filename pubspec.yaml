name: crowdtech
description: >-
  CrowdTech : actualités tech vérifiées, crowdfunding par fonctionnalités,
  marketplace avec séquestre et événements avec badges d'accès signés.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Toutes les dépendances sont gratuites et open source.
dependencies:
  flutter:
    sdk: flutter

  # Base de données locale SQLite (mobile, ordinateur et Web).
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1

  # Réseau et sécurité (API publiques, Firebase REST, signatures HMAC).
  http: ^1.6.0
  crypto: ^3.0.8

  # Photos, certificats PDF.
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1

  # Rappels d'événements programmés et scan des QR codes.
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  mobile_scanner: ^7.5.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
